databases:
  - name: kapi-postgres
    databaseName: kapi
    user: kapi
    plan: basic-256mb

services:
  - type: web
    name: kapi-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: pnpm --filter @kapi/control-plane start
    healthCheckPath: /ready
    preDeployCommand: pnpm db:migrate
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: kapi-postgres, property: connectionString }
      - key: KAPI_OPERATIONS
        value: off
      - key: KAPI_SECRET_KEY
        sync: false
      - key: KAPI_SESSION_SECRET
        sync: false
      - key: KAPI_ALLOWED_ORIGINS
        sync: false
      - key: KAPI_WEB_URL
        sync: false
      - key: CONTROL_PLANE_PUBLIC_URL
        sync: false
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_REDIRECT_URI
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: KAPI_METRICS_TOKEN
        sync: false

  - type: worker
    name: kapi-operations
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: pnpm --filter @kapi/control-plane start:worker
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: kapi-postgres, property: connectionString }
      - key: KAPI_SECRET_KEY
        sync: false
      - key: CONTROL_PLANE_PUBLIC_URL
        sync: false
      - key: VM_PROVIDER
        value: daytona
      - key: DAYTONA_API_KEY
        sync: false
      - key: KAPI_RECONCILE_DELETE
        value: "false"
      - key: KAPI_DAYTONA_CENTS_PER_HOUR
        sync: false

  - type: web
    name: kapi-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm build:web
    staticPublishPath: ./apps/web/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
